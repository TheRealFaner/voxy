name: manual-artifact

on: [ workflow_dispatch ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Gradle build
        run: ./gradlew spotlessCheck :neoforge:build

      - name: Publish jars to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=manual-latest
          BASE=$(sed -n 's/^archives_base_name[[:space:]]*=[[:space:]]*//p' gradle.properties)
          MOD=$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          MC=$(sed -n 's/^minecraft_version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          NEO="${BASE}-${MOD}+${MC}-neoforge.jar"
          NEO_JAR=$(ls neoforge/build/libs/*.jar | head -n 1)
          if [ "$(basename "$NEO_JAR")" != "$NEO" ]; then
            cp "$NEO_JAR" "neoforge/build/libs/$NEO"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Manual builds" \
            --notes "Rolling manual Voxy builds for NeoForge. Updated on every manual run." \
            --prerelease --latest=false
          gh release upload "$TAG" "neoforge/build/libs/$NEO" --clobber
