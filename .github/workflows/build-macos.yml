name: build-macos

on:
  workflow_dispatch:
  push:
    branches:
      - multiversion

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Ensure Metal toolchain
        run: |
          # Xcode 26+ ships the Metal toolchain as a separate component.
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun metal --version
          xcrun -sdk macosx metallib --version

      - name: Build NeoForge jar
        run: ./gradlew :neoforge:build --stacktrace --no-daemon

      - name: Verify macOS natives in jar
        run: |
          JAR=$(ls neoforge/build/libs/*.jar | head -n 1)
          echo "Built: $JAR"
          unzip -l "$JAR" | grep -E 'natives/macos/libvoxy_gl41metal\.dylib|natives/macos/gl41metal/voxy_gl41metal\.metallib'
          test -n "$(unzip -l "$JAR" | grep 'natives/macos/libvoxy_gl41metal.dylib')"
          test -n "$(unzip -l "$JAR" | grep 'natives/macos/gl41metal/voxy_gl41metal.metallib')"

      - name: Publish jar to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=neoforge-latest
          BASE=$(sed -n 's/^archives_base_name[[:space:]]*=[[:space:]]*//p' gradle.properties)
          MOD=$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          MC=$(sed -n 's/^minecraft_version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          CANONICAL="${BASE}-${MOD}+${MC}-neoforge.jar"
          JAR=$(ls neoforge/build/libs/*.jar | head -n 1)
          if [ "$(basename "$JAR")" != "$CANONICAL" ]; then
            cp "$JAR" "neoforge/build/libs/$CANONICAL"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Voxy NeoForge builds" \
            --notes "Universal NeoForge jar for Windows/Linux/Apple Silicon (arm64 Metal natives included). Intel Macs not supported." \
            --prerelease --latest=false
          gh release upload "$TAG" "neoforge/build/libs/$CANONICAL" --clobber
